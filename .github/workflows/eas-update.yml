name: EAS Update

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  update:
    name: EAS Update (OTA)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Publish OTA update
        env:
          EXPO_TOKEN: ${{ secrets.EAS_ACCESS_TOKEN }}
        run: eas update --branch production --message "auto: ${{ github.sha }}"
